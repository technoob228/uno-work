<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero banner — variant A</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f6f5f2;
        color: #1d1d1f;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 40px;
        align-items: center;
        padding: 72px 64px;
        min-height: 70vh;
      }
      .tag {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b6b6b;
      }
      h1 {
        font-size: 44px;
        line-height: 1.1;
        margin: 12px 0 16px;
        font-weight: 600;
      }
      p {
        font-size: 18px;
        color: #4a4a4a;
        max-width: 440px;
      }
      a.btn {
        display: inline-block;
        margin-top: 20px;
        background: #1d1d1f;
        color: #fff;
        padding: 12px 22px;
        border-radius: 10px;
        text-decoration: none;
      }
      .shot {
        aspect-ratio: 4/3;
        border-radius: 16px;
        background: linear-gradient(160deg, #fff, #e9e6df);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        display: grid;
        place-items: center;
        color: #999;
        font-size: 14px;
      }
      @media (max-width: 700px) {
        .hero {
          grid-template-columns: 1fr;
          padding: 40px 24px;
        }
        h1 {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div>
        <div class="tag">Variant A · calm</div>
        <h1>Your own cloud computer, ready for your agents</h1>
        <p>Chats, sites and bots in one place. It stays on at night, so the work goes on.</p>
        <a class="btn" href="#">Start free</a>
      </div>
      <div class="shot">Product screenshot</div>
    </section>
  </body>
</html>
